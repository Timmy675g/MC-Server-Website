<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research Consent Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"JetBrains Mono"', '"Roboto Mono"', 'monospace'],
            },
            colors: {
              stealth: {
                bg: '#050505',
                border: '#2b2b2b',
                panel: 'rgba(18, 18, 18, 0.58)',
                emerald: '#10b981',
              },
            },
            boxShadow: {
              emeraldGlow: '0 0 0 1px rgba(16,185,129,0.35), 0 0 22px rgba(16,185,129,0.38)',
            },
          },
        },
      };
    </script>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-stealth-bg text-slate-100 font-mono antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl items-center justify-center px-6 py-12">
      <section
        class="w-full rounded-2xl border border-stealth-border bg-stealth-panel p-6 backdrop-blur-xl md:p-8"
      >
        <header class="mb-6 border-b border-stealth-border pb-4">
          <p class="text-xs uppercase tracking-[0.2em] text-emerald-400/90">Link-26 Research Project</p>
          <h1 class="mt-2 text-xl font-semibold text-slate-50 md:text-2xl">Research Consent Initialization</h1>
          <p class="mt-2 text-sm text-slate-400">Review and accept all protocol statements to continue.</p>
        </header>

        <form id="consent-form" class="space-y-4" novalidate>
          <label class="flex items-start gap-3 rounded-lg border border-stealth-border bg-black/20 p-3">
            <input type="checkbox" class="consent-box mt-1 h-4 w-4 accent-emerald-500" />
            <span class="text-sm leading-relaxed text-slate-200">
              I hereby consent to the collection of anonymized gameplay telemetry for the Link-26 Research Project (RMPV 1.2.1).
            </span>
          </label>

          <label class="flex items-start gap-3 rounded-lg border border-stealth-border bg-black/20 p-3">
            <input type="checkbox" class="consent-box mt-1 h-4 w-4 accent-emerald-500" />
            <span class="text-sm leading-relaxed text-slate-200">
              I agree to participate in brief periodic surveys regarding collaborative dynamics and social interactions within the SurvivalKendy ecosystem.
            </span>
          </label>

          <label class="flex items-start gap-3 rounded-lg border border-stealth-border bg-black/20 p-3">
            <input type="checkbox" class="consent-box mt-1 h-4 w-4 accent-emerald-500" />
            <span class="text-sm leading-relaxed text-slate-200">
              I acknowledge that I am a voluntary participant and reserve the right to withdraw from the research study at any time without penalty.
            </span>
          </label>

          <label class="flex items-start gap-3 rounded-lg border border-stealth-border bg-black/20 p-3">
            <input type="checkbox" class="consent-box mt-1 h-4 w-4 accent-emerald-500" />
            <span class="text-sm leading-relaxed text-slate-200">
              I agree to abide by the System Integrity Protocol, which strictly prohibits the use of third-party exploits, hacks, or unauthorized scripts.
            </span>
          </label>

          <div class="pt-3">
            <button
              id="initialize-btn"
              type="submit"
              disabled
              class="w-full rounded-lg border border-slate-600/70 bg-slate-700/70 px-4 py-3 text-sm font-semibold uppercase tracking-[0.14em] text-slate-200 grayscale transition duration-200 disabled:cursor-not-allowed"
            >
              Initialize Connection
            </button>
          </div>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById('consent-form');
      const boxes = Array.from(document.querySelectorAll('.consent-box'));
      const button = document.getElementById('initialize-btn');

      function updateButtonState() {
        const allChecked = boxes.every((box) => box.checked);
        button.disabled = !allChecked;

        if (allChecked) {
          button.classList.remove('grayscale', 'bg-slate-700/70', 'border-slate-600/70', 'text-slate-200');
          button.classList.add('bg-emerald-500/90', 'border-emerald-400/80', 'text-black', 'shadow-emeraldGlow');
        } else {
          button.classList.add('grayscale', 'bg-slate-700/70', 'border-slate-600/70', 'text-slate-200');
          button.classList.remove('bg-emerald-500/90', 'border-emerald-400/80', 'text-black', 'shadow-emeraldGlow');
        }
      }

      boxes.forEach((box) => box.addEventListener('change', updateButtonState));
      updateButtonState();

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (button.disabled) return;
        alert('Consent acknowledged. Connection initialized.');
      });
    </script>
  </body>
</html>
