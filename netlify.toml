[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/factions"
  to = "/.netlify/functions/factions"
  status = 200

[[redirects]]
  from = "/api/players"
  to = "/.netlify/functions/players"
  status = 200

[[redirects]]
  from = "/api/uptime"
  to = "/.netlify/functions/uptime"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
