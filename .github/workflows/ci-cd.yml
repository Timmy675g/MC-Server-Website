name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret_scan:
    name: Secret Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        if: github.event_name != 'push'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Install Gitleaks CLI (push)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.24.3"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$ARCHIVE" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks CLI (push)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --redact \
            --exit-code 2 \
            --report-format sarif \
            --report-path results.sarif \
            --log-level info

      - name: Upload Gitleaks SARIF artifact (push)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: ignore

  quality:
    name: Lint + Build
    runs-on: ubuntu-latest
    needs: secret_scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_FORMSUBMIT_EMAIL: ${{ secrets.VITE_FORMSUBMIT_EMAIL }}
          VITE_FORMSUBMIT_ENDPOINT: ${{ secrets.VITE_FORMSUBMIT_ENDPOINT }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  verify_frontend_config:
    name: Verify Optional Frontend Config
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: quality
    env:
      VITE_FORMSUBMIT_EMAIL: ${{ secrets.VITE_FORMSUBMIT_EMAIL }}
      VITE_FORMSUBMIT_ENDPOINT: ${{ secrets.VITE_FORMSUBMIT_ENDPOINT }}
    steps:
      - name: Check optional frontend settings
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VITE_FORMSUBMIT_EMAIL}" && -z "${VITE_FORMSUBMIT_ENDPOINT}" ]]; then
            echo "Warning: VITE_FORMSUBMIT_EMAIL or VITE_FORMSUBMIT_ENDPOINT is not set. Apply form will use fallback endpoint."
          fi

          echo "Frontend deployment config check complete."
